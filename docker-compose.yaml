services:
  math_tool:
    build:
      context: ./calc
      dockerfile: mathtool.Dockerfile
    image: math_tool_custom:0.1.0
    container_name: math_tool
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1

  mcp_server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    image: pi_mcp_server:0.1.1
    container_name: mcp_server
    restart: always
    ports:
      - "8005:8005"
    env_file:
      - ./mcp_server/.env
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_PORT=8005
      - MATH_TOOL_BASE_URL=http://math_tool:8001

  agent_bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent_bot:0.2.0
    container_name: agent_bot
    restart: always
    ports:
      - "8002:8002"
    env_file:
      - ./app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_PROVIDER=gemini
      - GEMINI_MODEL=gemini-3.1-flash-lite-preview
      - GEMINI_FALLBACK_MODEL=gemini-2.5-flash
      - OLLAMA_API_BASE=http://10.247.179.197:11434
      - MCP_SERVER_URL=http://mcp_server:8005/mcp
      - MATH_TOOL_BASE_URL=http://math_tool:8001
      - PHOENIX_ENABLED=true
      - PHOENIX_PROJECT_NAME=pi-chat-api
      - PHOENIX_COLLECTOR_ENDPOINT=http://10.247.179.197:6006/v1/traces
    depends_on:
      - math_tool
      - mcp_server

  agent_bot_chat_bridge:
    image: agent_bot:0.2.0
    container_name: agent_bot_chat_bridge
    restart: always
    command: python -m app.bridge.google_chat.worker --send
    env_file:
      - ./app/.env
    environment:
      - AGENT_INTERNAL_URL=http://agent_bot:8002/chat
      - GOOGLE_APPLICATION_CREDENTIALS=./secrets/chat_secret.json
      - PYTHONUNBUFFERED=1
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      - agent_bot

  event_store_postgres:
    image: postgres:16-alpine
    container_name: event_store_postgres
    restart: unless-stopped
    profiles:
      - events
    environment:
      POSTGRES_DB: ${EVENT_STORE_POSTGRES_DB:-agent_bot_events}
      POSTGRES_USER: ${EVENT_STORE_POSTGRES_USER:-agent_bot}
      POSTGRES_PASSWORD: ${EVENT_STORE_POSTGRES_PASSWORD:-change_me_event_store}
    volumes:
      - event_store_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sem ports: fica acessível apenas dentro da rede Docker deste compose

volumes:
  event_store_pgdata: