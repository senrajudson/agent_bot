services:
  math_tool:
    build:
      context: ./calc
      dockerfile: mathtool.Dockerfile
    image: math_tool_custom:0.1.0
    container_name: math_tool
    restart: always
    ports:
      - "8001:8001"

  mcp_server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    image: pi_mcp_server:0.1.0
    container_name: mcp_server
    restart: always
    ports:
      - "8003:8003"
    env_file:
      - ./mcp_server/.env

  agent_bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent_bot:0.2.0
    container_name: agent_bot
    restart: always
    ports:
      - "8002:8002"
    env_file:
      - ./app/.env
    depends_on:
      - math_tool
      - mcp_server

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent_bot:0.2.0
    container_name: agent_bot_worker
    restart: always
    command: ["python", "-m", "app.worker_main"]
    env_file:
      - ./app/.env
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./secrets/gcp-key.json}:/secrets/gcp-key.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-key.json
    depends_on:
      - math_tool
      - mcp_server
