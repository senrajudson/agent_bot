services:
  math_tool:
    build:
      context: ./calc
      dockerfile: mathtool.Dockerfile
    image: math_tool_custom:0.1.0
    container_name: math_tool
    restart: always
    ports:
      - "8001:8001"

  agent_bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent_bot:0.1.0
    container_name: agent_bot
    restart: always
    ports:
      - "8002:8002"
    env_file:
      - ./app/.env
    depends_on:
      - math_tool
