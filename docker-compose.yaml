services:
  math_tool:
    build:
      context: ./calc
      dockerfile: mathtool.Dockerfile
    image: math_tool_custom:0.1.0
    container_name: math_tool
    restart: always
    ports:
      - '8001:8001'
    environment:
      - PYTHONUNBUFFERED=1

  mcp_server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    image: pi_mcp_server:0.1.1
    container_name: mcp_server
    restart: always
    ports:
      - '8005:8005'
    env_file:
      - ./mcp_server/.env
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_PORT=8005
      - AGENT_API_BASE_URL=http://agent_bot:8002
      - GOOGLE_DRIVE_EXPORT_CREDENTIALS_FILE=/run/secrets/pi_chat_drive_exporter/service-account.json
      # Precedência: environment > env_file > .env > defaults
      - ENABLE_MCP_DRIVE_ARTIFACT_DELIVERY=true
      - ENABLE_DRIVE_CSV_EXPORT_TOOL=false
    volumes:
      - ./secrets/pi_chat_drive_exporter:/run/secrets/pi_chat_drive_exporter:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import socket;
          s = socket.create_connection(('127.0.0.1', 8005), 2);
          s.close()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: agent_bot_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  agent_bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent_bot:0.2.0
    container_name: agent_bot
    restart: always
    ports:
      - '8002:8002'
    env_file:
      - ./app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_PROVIDER=gemini
      - GEMINI_MODEL=gemini-3.1-flash-lite-preview
      - GEMINI_FALLBACK_MODEL=gemini-2.5-flash
      - OLLAMA_API_BASE=http://10.247.179.197:11434
      - MCP_SERVER_URL=http://mcp_server:8005/mcp
      - PHOENIX_ENABLED=true
      - PHOENIX_PROJECT_NAME=pi-chat-api
      - PHOENIX_COLLECTOR_ENDPOINT=http://10.247.179.197:6006/v1/traces
      - AGENT_ARTIFACT_BASE_URL=http://agent_bot:8002
      - REDIS_URL=redis://redis:6379/0
      - REDIS_KEY_PREFIX=pi_chat:prod:memory
    volumes:
      - agent_artifacts:/tmp/agent_bot_artifacts
    depends_on:
      redis:
        condition: service_healthy
      math_tool:
        condition: service_started
      mcp_server:
        condition: service_healthy

  agent_bot_chat_bridge:
    image: agent_bot:0.2.0
    container_name: agent_bot_chat_bridge
    restart: always
    command: python -m app.bridge.google_chat.worker --send
    env_file:
      - ./app/.env
    environment:
      - AGENT_INTERNAL_URL=http://agent_bot:8002/chat
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/google_chat/service-account.json
      - PYTHONUNBUFFERED=1
      - AGENT_ARTIFACT_BASE_URL=http://agent_bot:8002/artifacts
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./secrets/google_chat:/run/secrets/google_chat:ro
      - agent_artifacts:/tmp/agent_bot_artifacts
    depends_on:
      redis:
        condition: service_healthy
      agent_bot:
        condition: service_started

  event_store_postgres:
    image: postgres:16-alpine
    container_name: event_store_postgres
    restart: unless-stopped
    profiles:
      - events
    environment:
      POSTGRES_DB: ${EVENT_STORE_POSTGRES_DB:-agent_bot_events}
      POSTGRES_USER: ${EVENT_STORE_POSTGRES_USER:-agent_bot}
      POSTGRES_PASSWORD: ${EVENT_STORE_POSTGRES_PASSWORD:-change_me_event_store}
    volumes:
      - event_store_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '127.0.0.1:${EVENT_STORE_POSTGRES_HOST_PORT:-5433}:5432'

volumes:
  agent_artifacts:
  event_store_pgdata:
  redis_data:
