[project]
name = "bot"
version = "0.2.0"
description = "Agent Bot — Google ADK based PI System chat API"
authors = [
    {name = "senrajudson", email = "judsonnascimento.filho@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "uvicorn[standard] (>=0.47.0,<0.48.0)",
    "fastapi (>=0.136.1,<0.137.0)",

    "pydantic (>=2.12.0,<2.13.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",

    "google-adk[mcp] (>=2.2.0,<3.0.0)",

    "litellm (>=1.83.7,<1.84.0)",

    "httpx (>=0.28.1,<0.29.0)",

    "arize-phoenix-otel (>=0.16.1,<0.17.0)",
    "opentelemetry-instrumentation-fastapi (>=0.62b0,<0.63b1)",
    "opentelemetry-instrumentation-httpx (>=0.62b0,<0.63b1)",

    "redis (>=8.0.0,<9.0.0)",

    "qdrant-client (>=1.18.0,<2.0.0)",
    "fastmcp (>=2.0.0,<3.0.0)",
    "google-api-python-client (>=2.197.0,<3.0.0)",
    "google-auth (>=2.55.0,<3.0.0)",
    "google-cloud-pubsub (>=2.39.0,<3.0.0)",
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
