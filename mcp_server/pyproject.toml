[project]
name = "pi-system-mcp-server"
version = "0.1.0"
description = "MCP server for PI System tools (tag queries, statistics, calculus, status)"
authors = [
    {name = "senrajudson", email = "judsonnascimento.filho@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastmcp (>=3.0.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "tenacity (>=9.0.0,<10.0.0)",
    "openpyxl (>=3.1.0,<4.0.0)",
    "google-api-python-client (>=2.197.0,<3.0.0)",
    "google-auth (>=2.55.0,<3.0.0)",
    "google-auth-httplib2 (>=0.4.0,<1.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
agent-bot-domain = {path = "../domain", develop = true}

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
