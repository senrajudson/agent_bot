[project]
name = "pi-system-mcp-server"
version = "0.1.0"
description = "MCP server for PI System tools (tag queries, statistics, calculus, status)"
authors = [
    {name = "senrajudson", email = "judsonnascimento.filho@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastmcp (>=3.0.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
