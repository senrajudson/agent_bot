services:

  redis_qa:
    image: redis:7-alpine
    container_name: agent_bot_redis_qa
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - agent_bot_redis_qa_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s


  db_qa:
    image: postgres:16.14-alpine
    container_name: agent_bot_postgres_qa
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - agent_bot_postgres_qa_data:/var/lib/postgresql/data


  backup_db:
    image: postgres:16.14-alpine
    container_name: agent_bot_backup_db_qa
    restart: unless-stopped
    depends_on:
      - db_qa
    environment:
      - TZ=America/Sao_Paulo
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGHOST=db_qa
      - PGUSER=${POSTGRES_USER}
      - PGDATABASE=${POSTGRES_DB}
      - OUTDIR=/backup
      - BACKUP_INTERVAL_SECONDS=86400
      - KEEP_LAST=7
    volumes:
      - ./backup/postgres:/backup
      - ./backup/scripts:/scripts:ro
    command: ['/bin/sh', '/scripts/backup.sh']


volumes:

  agent_bot_redis_qa_data:
    name: agent_bot_redis_qa_data

  agent_bot_postgres_qa_data:
    name: agent_bot_postgres_qa_data