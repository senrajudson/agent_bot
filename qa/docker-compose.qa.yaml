services:

  redis_qa:
    image: redis:7-alpine
    container_name: agent_bot_redis_qa
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - agent_bot_redis_qa_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s


  db_qa:
    image: postgres:16.14-alpine
    container_name: agent_bot_postgres_qa
    restart: unless-stopped
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-agent_bot_qa}
    volumes:
      - agent_bot_postgres_qa_data:/var/lib/postgresql/data
      - ./init-n8n-db.sql:/docker-entrypoint-initdb.d/init-n8n-db.sql:ro


  qdrant_qa:
    image: qdrant/qdrant:v1.18.0
    container_name: agent_bot_qdrant_qa
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - agent_bot_qdrant_qa_data:/qdrant/storage


  n8n_qa:
    image: n8n_custom:2.21.7
    build:
      context: ..
      dockerfile: n8n.Dockerfile
      args:
        N8N_VERSION: 2.21.7
    container_name: n8n_app_qa
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db_qa
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n_qa}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change_me_to_a_secure_random_key_qa}
      - N8N_PROTOCOL=http
      - N8N_HOST=${LOCAL_HOST:-localhost}
      - N8N_PORT=5678
      - WEBHOOK_URL=http://${LOCAL_HOST:-localhost}:5678/
      - BOT_API_BASE_URL=${BOT_API_BASE_URL:-http://host.docker.internal:8012}
      - BOT_CHAT_URL=${BOT_CHAT_URL:-http://host.docker.internal:8012/chat}
      - N8N_SECURE_COOKIE=false
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis_qa
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_DB=1
      - QDRANT_URL=http://qdrant_qa:6333
    depends_on:
      redis_qa:
        condition: service_healthy
      db_qa:
        condition: service_started
      qdrant_qa:
        condition: service_started
    volumes:
      - n8n_qa_data:/home/node/.n8n


  n8n_worker_qa:
    image: n8n_custom:2.21.7
    build:
      context: ..
      dockerfile: n8n.Dockerfile
      args:
        N8N_VERSION: 2.21.7
    container_name: n8n_worker_qa
    restart: unless-stopped
    command: worker --concurrency=3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db_qa
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n_qa}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change_me_to_a_secure_random_key_qa}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis_qa
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_DB=1
      - BOT_API_BASE_URL=${BOT_API_BASE_URL:-http://host.docker.internal:8012}
      - BOT_CHAT_URL=${BOT_CHAT_URL:-http://host.docker.internal:8012/chat}
      - N8N_SECURE_COOKIE=false
      - QDRANT_URL=http://qdrant_qa:6333
    depends_on:
      - n8n_qa
      - redis_qa
      - qdrant_qa


  backup_db:
    image: postgres:16.14-alpine
    container_name: agent_bot_backup_db_qa
    restart: unless-stopped
    depends_on:
      - db_qa
    environment:
      - TZ=America/Sao_Paulo
      - PGPASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PGHOST=db_qa
      - PGUSER=${POSTGRES_USER:-postgres}
      - PGDATABASE=${POSTGRES_DB:-agent_bot_qa}
      - N8N_DB_NAME=${N8N_DB_NAME:-n8n_qa}
      - OUTDIR=/backup
      - BACKUP_INTERVAL_SECONDS=86400
      - KEEP_LAST=7
    volumes:
      - ./backup/postgres:/backup
      - ./backup/scripts:/scripts:ro
    command: ['/bin/sh', '/scripts/backup.sh']


volumes:

  agent_bot_redis_qa_data:
    name: agent_bot_redis_qa_data

  agent_bot_postgres_qa_data:
    name: agent_bot_postgres_qa_data

  agent_bot_qdrant_qa_data:
    name: agent_bot_qdrant_qa_data

  n8n_qa_data:
    name: n8n_qa_data