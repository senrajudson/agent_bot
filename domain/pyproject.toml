[project]
name = "agent-bot-domain"
version = "0.1.0"
description = "Domain layer — shared clients, services, and utilities for Agent Bot"
authors = [
    {name = "senrajudson", email = "judsonnascimento.filho@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "tenacity (>=9.0.0,<10.0.0)",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pims*", "analytics*", "pims_ops*", "conversation*", "shared*"]
